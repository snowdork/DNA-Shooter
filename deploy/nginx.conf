# Example dedicated virtual host. Set server_name and root for your VPS.
# Include this server block from nginx's http context; use your existing TLS setup.
server {
    listen 80;
    server_name dna.example.com;
    root /var/www/dna-shooter/current;
    index index.html;

    sendfile on;
    # Requires nginx built with --with-http_gzip_static_module (nginx -V).
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;

    # Vite hashes these names; old assets may be cached indefinitely.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML and unversioned public files must revalidate after deployments.
    # There is no client-side router, so missing files return an actual 404.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
